apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nic-configuration-daemon
  namespace: {{ .RuntimeSpec.Namespace }}
  labels:
    app.kubernetes.io/name: nic-configuration-daemon
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nic-configuration-daemon
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: nic-configuration-daemon
      labels:
        nvidia.com/nic-configuration-daemon: ""
        app.kubernetes.io/name: nic-configuration-daemon
    spec:
      serviceAccountName: nic-configuration-operator
      terminationGracePeriodSeconds: 10
      tolerations:
        {{- if .Tolerations }}
        {{- .Tolerations | yaml | nindent 8 }}
        {{- end }}
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      hostNetwork: true
      nodeSelector:
        # We need to run it after the DOCA driver is started to be able to successfully configure RoCE settings.
        network.nvidia.com/operator.mofed.wait: "false"
      hostPID: true
      priorityClassName: system-node-critical
      {{- if .NodeAffinity }}
      affinity:
        nodeAffinity:
          {{- .NodeAffinity | yaml | nindent 10 }}
      {{- end }}
      {{- if .CrSpec.ConfigurationDaemon.ImagePullSecrets }}
      imagePullSecrets:
      {{- range .CrSpec.ConfigurationDaemon.ImagePullSecrets }}
      - name: {{ . }}
      {{- end }}
      {{- end }}
      containers:
        - image: {{ imagePath .CrSpec.ConfigurationDaemon.Repository .CrSpec.ConfigurationDaemon.Image .CrSpec.ConfigurationDaemon.Version }}
          name: nic-configuration-daemon
          securityContext:
            privileged: true
          {{- with .RuntimeSpec.ContainerResources }}
          {{- with index . "nic-configuration-daemon" }}
          resources:
            {{- if .Requests }}
            requests:
              {{ .Requests | yaml | nindent 14}}
            {{- end }}
            {{- if .Limits }}
            limits:
              {{ .Limits | yaml | nindent 14}}
            {{- end }}
          {{- end }}
          {{- else }}
          resources:
            limits:
              memory: 5Gi
            requests:
              cpu: 100m
              memory: 512Mi
          {{- end }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: LOG_LEVEL
              value: {{ .CrSpec.LogLevel }}
            {{- range .RuntimeSpec.DaemonEnv }}
              {{ . | yaml | nindentPrefix 14 "- " }}
            {{- end }}
          volumeMounts:
            - name: firmware-images
              mountPath: /nic-firmware-images
            {{- range $index, $secret := .CrSpec.FirmwareImagePullSecrets }}
            - name: firmware-auth-{{ $index }}
              mountPath: /var/run/nic-firmware-auth/{{ $secret }}
              readOnly: true
            {{- end }}
            {{- if .CrSpec.CertConfig }}
            - name: trusted-ca
              mountPath: /etc/pki/ca-trust/extracted/pem
              readOnly: true
            {{- end }}
            - name: sys
              mountPath: /sys
              readOnly: false
            - name: proc
              mountPath: /proc
              readOnly: false
            - name: host
              mountPath: /host
            - name: dev
              mountPath: /dev
          {{- if .CrSpec.NicFirmwareStorage }}
            - name: firmware-cache
              mountPath: /nic-firmware
              readOnly: true
          {{- end }}
      volumes:
        - name: firmware-images
          emptyDir:
            sizeLimit: {{ .RuntimeSpec.FirmwareImageCacheSize }}
        {{- range $index, $secret := .CrSpec.FirmwareImagePullSecrets }}
        - name: firmware-auth-{{ $index }}
          secret:
            secretName: {{ $secret }}
            optional: true
        {{- end }}
        {{- if .CrSpec.CertConfig }}
        - name: trusted-ca
          configMap:
            name: {{ .CrSpec.CertConfig.Name }}
            optional: true
            items:
              - key: ca-bundle.crt
                path: tls-ca-bundle.pem
        {{- end }}
        - name: sys
          hostPath:
            path: /sys
        - name: proc
          hostPath:
            path: /proc
        - name: host
          hostPath:
            path: /
        - name: dev
          hostPath:
            path: /dev
        {{- if .CrSpec.NicFirmwareStorage }}
        - name: firmware-cache
          persistentVolumeClaim:
            claimName: {{ .CrSpec.NicFirmwareStorage.PVCName }}
        {{- end }}
