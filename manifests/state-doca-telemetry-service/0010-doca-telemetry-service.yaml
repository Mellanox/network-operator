---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: doca-telemetry-service
  namespace: {{ .RuntimeSpec.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: doca-telemetry
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doca-telemetry
    spec:
      # Required by the sysfs collector only.
      hostNetwork: true
      # Required to expose telemetry to local clients over IPC.
      hostIPC: true
      serviceAccount: doca-telemetry-service
      nodeSelector:
        # We need to run it after DOCA driver is started to be able successfully restart driver by a container.
        feature.node.kubernetes.io/pci-15b3.present: "true"
        network.nvidia.com/operator.mofed.wait: "false"
      {{- if .NodeAffinity }}
      affinity:
        nodeAffinity:
          {{- .NodeAffinity | yaml | nindent 10 }}
      {{- end }}
      {{- if .CrSpec.ImagePullSecrets }}
      imagePullSecrets:
      {{- range .CrSpec.ImagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      tolerations:
      {{- if .Tolerations }}
        {{- .Tolerations | yaml | nindent 8 }}
        {{- end }}
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: NoSchedule
      containers:
      - name: doca-telemetry-service
        image: {{ imagePath .CrSpec.Repository .CrSpec.Image .CrSpec.Version }}
        {{- with .RuntimeSpec.ContainerResources }}
        {{- with index . "doca-telemetry-service" }}
        resources:
          {{- if .Requests }}
          requests:
            {{ .Requests | yaml | nindent 14}}
          {{- end }}
          {{- if .Limits }}
          limits:
            {{ .Limits | yaml | nindent 14 }}
          {{- end }}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: doca-telemetry-service-configmap
          mountPath: /configmap
        - name: telemetry-service-config
          mountPath: /config
        - name: telemetry-service-data
          mountPath: /data
        # Holds the UNIX domain sockets DTS serves IPC on. Sockets are filesystem objects, so
        # sharing the host IPC namespace is not enough for host clients to reach them.
        - name: telemetry-service-ipc-sockets
          mountPath: /tmp/ipc_sockets
        # The other half of IPC: short messages go over the sockets above, payloads through shared
        # memory. DTS always writes it to /dev/shm, only the host directory behind it varies.
        - name: telemetry-ipc-shm
          mountPath: /dev/shm
        - name: telemetry-service-logs
          mountPath: /var/log
        # telemetry-init.sh only generates configuration into an empty /config, so the overwrite
        # is what keeps the ConfigMap authoritative now that /config persists on the host.
        # Clearing /config instead would discard the node's configuration on every restart.
        command: [ "/bin/bash", "-c", "FORCE_CONFIG_OVERWRITE=1 DTS_CONFIG_DIR=host /usr/bin/telemetry-init.sh && /usr/bin/telemetry-run.sh" ]
        # Required only for the sysfs collector only.
        securityContext:
          privileged: true
      volumes:
        - name: doca-telemetry-service-configmap
          configMap:
            name: {{ .ConfigMapName }}
        - name: telemetry-service-config
          hostPath:
            path: /var/opt/doca-telemetry/config
            type: DirectoryOrCreate
        - name: telemetry-service-data
          hostPath:
            path: /var/opt/doca-telemetry/data
            type: DirectoryOrCreate
        # IPC clients must be pointed at this directory. It deliberately departs from the
        # /opt/mellanox/doca/services default documented for DTS, so that node-local state stays
        # under /var like the rest of the operator's host paths.
        - name: telemetry-service-ipc-sockets
          hostPath:
            path: /var/opt/doca-telemetry/ipc_sockets
            type: DirectoryOrCreate
        # Clients on the node address the shared memory by the host path, so only the host side is
        # conditional: a client in a container mounts /dev/shm/telemetry at its own /dev/shm, while
        # one running directly on the node reads it from the host's /dev/shm.
        - name: telemetry-ipc-shm
          hostPath:
            {{- if .CrSpec.ShareHostSharedMemory }}
            path: /dev/shm
            {{- else }}
            path: /dev/shm/telemetry
            {{- end }}
            type: DirectoryOrCreate
        - name: telemetry-service-logs
          hostPath:
            path: /var/log/doca/telemetry
            type: DirectoryOrCreate
{{ if .DeployConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .ConfigMapName }}
  namespace: {{ .RuntimeSpec.Namespace }}
data:
  # This configmap name is hardcoded inside the DTS container and needs to stay in sync.
  dts_config_map.ini: |
    ############################ GENERAL CONFIGURATION ############################
    # Port for TCP connection with aggregator
    port=0
    # Timeout for forced page rotation
    sync-time-limit=10000

    # Sizes of internal buffers used by counter and event providers.
    # By the default they set to 1MB, however
    # If set to 0 buffers will be rounded up to fit at least a single data payload.
    counter-buffer-size=0
    event-buffer-size=0

    # Verbosity levels: error=3, info=6, debug=7
    verbose=6

    # Sampling interval for providers in ms
    update=1000

    # Configuration cache folder that is used on restarts.
    runtime-configuration-folder=/config/clx_last_runtime_conf
    idle-time-limit=0

    ################################### PROVIDERS #################################
    enable-explicitly=true

    #####################################
    # DOCA TELEMETRY SERVICE PROVIDERS: #
    #####################################

    enable-provider=sysfs
    enable-provider=ethtool
    enable-provider=ifconfig

    ################################ DATA OUTPUTS #################################

    ################################ Prometheus ###################################
    # Set address and port for Prometheus endpoint.
    # If not set, the Prometheus endpoint is disabled.
    prometheus=http://0.0.0.0:9189

    # Comma-separated list of data source tags to be ignored by Prometheus exporter
    prometheus-ignore-tags=FI_metrics
{{end}}
