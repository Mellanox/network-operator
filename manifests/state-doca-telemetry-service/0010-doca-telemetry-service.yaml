---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: doca-telemetry-service
  namespace: {{ .RuntimeSpec.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: doca-telemetry
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: doca-telemetry
    spec:
      # Required by the sysfs collector only.
      hostNetwork: true
      hostIPC: true
      restartPolicy: Always
      serviceAccount: doca-telemetry-service
      nodeSelector:
        # We need to run it after DOCA driver is started to be able successfully restart driver by a container.
        feature.node.kubernetes.io/pci-15b3.present: "true"
        network.nvidia.com/operator.mofed.wait: "false"
      {{- if .NodeAffinity }}
      affinity:
        nodeAffinity:
          {{- .NodeAffinity | yaml | nindent 10 }}
      {{- end }}
      {{- if .CrSpec.ImagePullSecrets }}
      imagePullSecrets:
      {{- range .CrSpec.ImagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      tolerations:
      {{- if .Tolerations }}
        {{- .Tolerations | yaml | nindent 8 }}
        {{- end }}
        - key: "nvidia.com/gpu"
          operator: "Exists"
          effect: NoSchedule
      containers:
      - name: doca-telemetry-service
        image: {{ imagePath .CrSpec.Repository .CrSpec.Image .CrSpec.Version }}
        {{- with .RuntimeSpec.ContainerResources }}
        {{- with index . "doca-telemetry-service" }}
        resources:
          {{- if .Requests }}
          requests:
            {{ .Requests | yaml | nindent 14}}
          {{- end }}
          {{- if .Limits }}
          limits:
            {{ .Limits | yaml | nindent 14 }}
          {{- end }}
        {{- end }}
        {{- end }}
        volumeMounts:
        - name: doca-telemetry-service-configmap
          mountPath: /configmap
        # Required by the pod_resources collector only.
        - name: pod-device-resources
          mountPath: /var/lib/kubelet/pod-resources
        # Required by the pod_resources collector only.
        - name: cni
          mountPath: /var/run/k8s.cni.cncf.io/devinfo/cni
        - name: telemetry-service-config
          mountPath: /config
        - name: telemetry-service-data
          mountPath: /data
        - name: telemetry-service-ipc-sockets
          mountPath: /tmp/ipc_sockets
        - name: telemetry-ipc-shm
          mountPath: /dev/shm
        - name: telemetry-service-logs
          mountPath: /var/log
        # diagnostic_data / low_freq_debug provider
        - name: dev-infiniband
          mountPath: /dev/infiniband
        - name: sys-class-infiniband
          mountPath: /sys/class/infiniband
        - name: dev-fwctl
          mountPath: /dev/fwctl
        - name: sys-class-fwctl
          mountPath: /sys/class/fwctl
        # ppcc_eth and amber providers
        - name: dev-mst
          mountPath: /dev/mst
        # ppcc_eth provider
        - name: mft-sdk
          mountPath: /usr/lib64/mft
        - name: etc-mft
          mountPath: /etc/mft
        - name: mft-share
          mountPath: /usr/share/mft
        # amber provider
        - name: host-mlxlink-ext
          mountPath: /usr/bin/mlxlink_ext
          readOnly: true
        - name: host-mdevices-info
          mountPath: /usr/bin/mdevices_info
          readOnly: true
        - name: sys-bus-pci
          mountPath: /sys/bus/pci
        - name: sys-class-net
          mountPath: /sys/class/net
        env:
        # Required by the pod_resources collector only.
        - name: MY_POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: PROMETHEUS_XCSET_JOIN_FIELDS
          value: "hca"
        - name: PROMETHEUS_XCSET_MANDATORY_TYPES
          value: "counters,pod_resources_event"
        command: [ "/bin/bash", "-c", "rm -rf /config/* && DTS_CONFIG_DIR=host /usr/bin/telemetry-init.sh && /usr/bin/telemetry-run.sh" ]
        # Required only for the sysfs collector only.
        securityContext:
          privileged: true
      volumes:
        - name: doca-telemetry-service-configmap
          configMap:
            name: {{ .ConfigMapName }}
        # Required by the pod_resources collector only.
        - name: pod-device-resources
          hostPath:
            path: /var/lib/kubelet/pod-resources
        # Required by the pod_resources collector only.
        - name: cni
          hostPath:
            path: /var/run/k8s.cni.cncf.io/devinfo/cni/
        - name: telemetry-service-config
          hostPath:
            path: /host/telemetry/config
            type: DirectoryOrCreate
        - name: telemetry-service-data
          hostPath:
            path: /host/telemetry/data
            type: DirectoryOrCreate
        - name: telemetry-service-ipc-sockets
          hostPath:
            path: /host/telemetry/ipc_sockets
            type: DirectoryOrCreate
        - name: telemetry-ipc-shm
          hostPath:
            path: /dev/shm/telemetry
            type: DirectoryOrCreate
        - name: telemetry-service-logs
          hostPath:
            path: /var/log/doca/telemetry
            type: DirectoryOrCreate
        # diagnostic_data / low_freq_debug provider: DOCA device access via verbs and fwctl
        - name: dev-infiniband
          hostPath:
            path: /dev/infiniband
            type: DirectoryOrCreate
        - name: sys-class-infiniband
          hostPath:
            path: /sys/class/infiniband
            type: DirectoryOrCreate
        - name: dev-fwctl
          hostPath:
            path: /dev/fwctl
            type: DirectoryOrCreate
        - name: sys-class-fwctl
          hostPath:
            path: /sys/class/fwctl
            type: DirectoryOrCreate
        # ppcc_eth and amber providers: MST char devices
        - name: dev-mst
          hostPath:
            path: /dev/mst
            type: DirectoryOrCreate
        # ppcc_eth provider: MFT PRM Access Register SDK (libmlxreg_sdk)
        - name: mft-sdk
          hostPath:
            path: /usr/lib64/mft
            type: DirectoryOrCreate
        - name: etc-mft
          hostPath:
            path: /etc/mft
            type: DirectoryOrCreate
        - name: mft-share
          hostPath:
            path: /usr/share/mft
            type: DirectoryOrCreate
        # amber provider: host MFT tools and sysfs for file-based MST discovery
        - name: host-mlxlink-ext
          hostPath:
            path: /usr/bin/mlxlink_ext
            type: File
        - name: host-mdevices-info
          hostPath:
            path: /usr/bin/mdevices_info
            type: File
        - name: sys-bus-pci
          hostPath:
            path: /sys/bus/pci
            type: DirectoryOrCreate
        - name: sys-class-net
          hostPath:
            path: /sys/class/net
            type: DirectoryOrCreate
{{ if .DeployConfigMap }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .ConfigMapName }}
  namespace: {{ .RuntimeSpec.Namespace }}
data:
  # This configmap name is hardcoded inside the DTS container and needs to stay in sync.
  dts_config_map.ini: |
    ############################ GENERAL CONFIGURATION ############################
    # Port for TCP connection with aggregator
    port=0
    # Timeout for forced page rotation
    sync-time-limit=10000

    # Sizes of internal buffers used by counter and event providers.
    # By the default they set to 1MB, however
    # If set to 0 buffers will be rounded up to fit at least a single data payload.
    counter-buffer-size=0
    event-buffer-size=0

    # Verbosity levels: error=3, info=6, debug=7
    verbose=6

    # Sampling interval for providers in ms
    update=1000

    # Configuration cache folder that is used on restarts.
    runtime-configuration-folder=/config/clx_last_runtime_conf
    idle-time-limit=0

    ################################### PROVIDERS #################################
    enable-explicitly=true

    #####################################
    # DOCA TELEMETRY SERVICE PROVIDERS: #
    #####################################

    enable-provider=sysfs
    enable-provider=pod_resources
    enable-provider=ethtool
    enable-provider=ifconfig

    ################################ DATA OUTPUTS #################################

    ################################ Prometheus ###################################
    # Set address and port for Prometheus endpoint.
    # If not set, the Prometheus endpoint is disabled.
    prometheus=http://0.0.0.0:9189

    # Prometheus can use data field as index to keep several data records with
    # different index value. Index fields will be added to Prometheus labels
    # Comma-separated counterset description for Prometheus indexing
    #prometheus-indexes=idx1,idx2

    # Comma-separated fieldset description for Prometheus indexing
    #prometheus-fset-indexes=idx1,idx2
    prometheus-fset-indexes=device_name,device_id,pod_name,id

    # Comma-separated list of counter names to be ignored by Prometheus exporter
    #prometheus-ignore-names=counter_name1,counter_name_2

    # Comma-separated list of data source tags to be ignored by Prometheus exporter
    prometheus-ignore-tags=FI_metrics
{{end}}
