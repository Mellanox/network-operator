apiVersion: apps/v1
kind: DaemonSet
metadata:
  labels:
    app: mofed-{{ .RuntimeSpec.OSName }}{{ .RuntimeSpec.OSVer }}-{{ .RuntimeSpec.KernelHash }}{{ .DaemonSetNameSuffix }}
    nvidia.com/ofed-driver: ""
    mofed-ds-format-version: "1"
    ds-owner: {{ .DSOwner }}
  name: mofed-{{ .RuntimeSpec.OSName }}{{ .RuntimeSpec.OSVer }}-{{ .RuntimeSpec.KernelHash }}{{ .DaemonSetNameSuffix }}-ds
  namespace: {{ .RuntimeSpec.Namespace }}
spec:
  updateStrategy:
    type: OnDelete
  selector:
    matchLabels:
      app: mofed-{{ .RuntimeSpec.OSName }}{{ .RuntimeSpec.OSVer }}-{{ .RuntimeSpec.KernelHash }}{{ .DaemonSetNameSuffix }}
  template:
    metadata:
      labels:
        app: mofed-{{ .RuntimeSpec.OSName }}{{ .RuntimeSpec.OSVer }}-{{ .RuntimeSpec.KernelHash }}{{ .DaemonSetNameSuffix }}
        kernel: {{ .RuntimeSpec.Kernel }}
        nvidia.com/ofed-driver: ""
        ds-owner: {{ .DSOwner }}
    spec:
      priorityClassName: system-node-critical
      # Rendered from driverPodTolerations: the CR's tolerations plus the ones the operator
      # always adds. Node pool discovery filters against this same set, so nothing may be added
      # here without going through that function.
      tolerations:
        {{- if .Tolerations }}
        {{- .Tolerations | yaml | nindent 8 }}
        {{- end }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: nvidia.com/ofed-driver
                    operator: Exists
              topologyKey: kubernetes.io/hostname
      serviceAccountName: ofed-driver
      hostNetwork: true
      {{- if .CrSpec.ImagePullSecrets }}
      imagePullSecrets:
      {{- range .CrSpec.ImagePullSecrets }}
        - name: {{ . }}
      {{- end }}
      {{- end }}
      {{- if .RuntimeSpec.InitContainerConfig.InitContainerEnable  }}
      initContainers:
        - name: network-operator-init-container
          imagePullPolicy: IfNotPresent
          image: {{ .RuntimeSpec.InitContainerConfig.InitContainerImageName }}
          args:
            - --node-name
            - $(NODE_NAME)
            - --configmap-name
            - ofed-init-container-config
            - --configmap-namespace
            - {{ .RuntimeSpec.Namespace }}
            - --configmap-key
            - config.json
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            {{- if .CrSpec.Env }}
            {{- range .CrSpec.Env }}
            {{ . | yaml | nindentPrefix 14 "- " }}
            {{- end }}
            {{- end }}
          volumeMounts:
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
            - name: host-sys
              mountPath: /host/sys
              readOnly: true
      {{- end }}
      containers:
        - image: {{ .RuntimeSpec.MOFEDImageName }}
          imagePullPolicy: IfNotPresent
          name: mofed-container
          securityContext:
            privileged: true
            seLinuxOptions:
              level: "s0"
          env:
          {{- if .RuntimeSpec.UseDtk }}
            - name: DTK_OCP_DRIVER_BUILD
              value: "true"
            - name: DTK_OCP_NIC_SHARED_DIR
              value: "/mnt/shared-doca-driver-toolkit"
          {{- end }}
          {{- if .CrSpec.Env }}
          {{- range .CrSpec.Env }}
            {{ . | yaml | nindentPrefix 14 "- " }}
          {{- end }}
          {{- end }}
          volumeMounts:
            - name: run-mlnx-ofed
              mountPath: /run/mellanox/drivers
              mountPropagation: Bidirectional
            - name: etc-network
              mountPath: /etc/network
            - name: host-etc
              mountPath: /host/etc
            - name: host-usr
              mountPath: /host/usr
            - name: host-udev
              mountPath: /host/lib/udev
            - name: host-run-udev
              mountPath: /run/udev
              readOnly: true
            - name: host-lib-modules
              mountPath: /host/lib/modules
            - name: drivers-inventory
              mountPath: /mnt/drivers-inventory
            - name: host-ib-core
              mountPath: /etc/modprobe.d/ib_core.conf
            - name: dev-infiniband
              mountPath: /dev/infiniband
            {{- if.AdditionalVolumeMounts.VolumeMounts }}
            {{- range .AdditionalVolumeMounts.VolumeMounts }}
            - name: {{ .Name }}
              mountPath: {{ .MountPath }}
              subPath: {{ .SubPath }}
              readOnly: {{ .ReadOnly }}
            {{- end }}
            {{- end }}
            {{- if .RuntimeSpec.UseDtk }}
            - name: shared-doca-driver-toolkit
              mountPath: /mnt/shared-doca-driver-toolkit
            {{- end}}
          {{- with .RuntimeSpec.ContainerResources }}
          {{- with index . "mofed-container" }}
          resources:
            {{- if .Requests }}
            requests:
              {{ .Requests | yaml | nindent 14}}
            {{- end }}
            {{- if .Limits }}
            limits:
              {{ .Limits | yaml | nindent 14}}
            {{- end }}
          {{- end }}
          {{- end }}
          startupProbe:
            exec:
              command:
                [sh, -c, 'ls /run/mellanox/drivers/.driver-ready']
            initialDelaySeconds: {{ .CrSpec.StartupProbe.InitialDelaySeconds }}
            failureThreshold: {{ .CrSpec.StartupProbe.FailureThreshold }}
            successThreshold: 1
            timeoutSeconds: {{ .CrSpec.StartupProbe.TimeoutSeconds }}
            periodSeconds: {{ .CrSpec.StartupProbe.PeriodSeconds }}
          livenessProbe:
            exec:
              command:
                [sh, -c, 'lsmod | grep mlx5_core']
            initialDelaySeconds: {{ .CrSpec.LivenessProbe.InitialDelaySeconds }}
            failureThreshold: {{ .CrSpec.LivenessProbe.FailureThreshold }}
            successThreshold: 1
            timeoutSeconds: {{ .CrSpec.LivenessProbe.TimeoutSeconds }}
            periodSeconds: {{ .CrSpec.LivenessProbe.PeriodSeconds }}
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  ofed_ready_fail() {
                    echo "OFED not ready: $*" >&2
                    exit 1
                  }
                  ofed_ready_module() {
                    [ -d "/sys/module/$1" ] || ofed_ready_fail "required module $1 is absent"
                    if [ -e "/sys/module/$1/initstate" ]; then
                      [ "$(cat "/sys/module/$1/initstate")" = live ] ||
                        ofed_ready_fail "required module $1 is not live"
                    fi
                  }
                  ofed_ready_optional() {
                    local enabled="$2" depends
                    if [ -z "$enabled" ]; then
                      # Match openibd's defaults for modules supplied by MLNX_OFED.
                      # Inspection failures must not silently disable a readiness check.
                      depends=$(modinfo -F depends "$1") ||
                        ofed_ready_fail "cannot determine whether module $1 is enabled"
                      case "$depends" in
                        *mlx_compat*) enabled=yes ;;
                      esac
                    fi
                    if [ "$enabled" = yes ]; then
                      ofed_ready_module "$1"
                    fi
                  }
                  # openib.conf uses shell assignments; Bash matches openibd's interpreter.
                  ofed_ready_config=${OPENIBD_CONFIG:-/etc/infiniband/openib.conf}
                  [ -r "$ofed_ready_config" ] || ofed_ready_fail "cannot read $ofed_ready_config"
                  . "$ofed_ready_config" || ofed_ready_fail "cannot load $ofed_ready_config"
                  for ofed_ready_name in mlx5_core mlx5_ib ib_core; do
                    ofed_ready_module "$ofed_ready_name"
                  done
                  ofed_ready_optional ib_uverbs "${UVERBS_LOAD:-}"
                  ofed_ready_optional ib_umad "${UMAD_LOAD:-}"
                  # openibd also enables IPoIB when the legacy SDP module is requested.
                  if [ "${SDP_LOAD:-}" = yes ]; then IPOIB_LOAD=yes; fi
                  ofed_ready_optional ib_ipoib "${IPOIB_LOAD:-}"
                  ofed_ready_optional rdma_cm "${RDMA_CM_LOAD:-}"
                  ofed_ready_optional rdma_ucm "${RDMA_UCM_LOAD:-}"
            initialDelaySeconds: {{ .CrSpec.ReadinessProbe.InitialDelaySeconds }}
            failureThreshold: {{ .CrSpec.ReadinessProbe.FailureThreshold }}
            successThreshold: 1
            timeoutSeconds: {{ .CrSpec.ReadinessProbe.TimeoutSeconds }}
            periodSeconds: {{ .CrSpec.ReadinessProbe.PeriodSeconds }}
        {{- if .RuntimeSpec.UseDtk }}
        - image: {{ .RuntimeSpec.DtkImageName }}
          imagePullPolicy: IfNotPresent
          name: openshift-driver-toolkit-ctr
          command: [bash, -xc]
          args:
            - |
              # PID 1 ignores SIGTERM unless a handler is installed; without this trap the
              # DTK sidecar can stay Running after mofed-container exits and block pod deletion
              # until terminationGracePeriodSeconds elapses and kubelet sends SIGKILL.
              trap 'echo "DTK sidecar received termination signal, exiting"; exit 0' TERM INT
              until [ -f /mnt/shared-doca-driver-toolkit/{{ .RuntimeSpec.Kernel }}/dtk_start_compile ]; do
                echo Waiting for mofed-container container to prepare the shared directory
                # Background sleep + wait so SIGTERM interrupts promptly (sleep alone may not)
                sleep 3 &
                wait $! || true
              done
              exec /mnt/shared-doca-driver-toolkit/{{ .RuntimeSpec.Kernel }}/dtk_nic_driver_build.sh
          env:
            - name: DTK_OCP_NIC_SHARED_DIR
              value: "/mnt/shared-doca-driver-toolkit"
          {{- if .CrSpec.Env }}
          {{- range .CrSpec.Env }}
            {{ . | yaml | nindentPrefix 14 "- " }}
          {{- end }}
          {{- end }}
          volumeMounts:
            {{- if.AdditionalVolumeMounts.VolumeMounts }}
            {{- range .AdditionalVolumeMounts.VolumeMounts }}
            - name: {{ .Name }}
              mountPath: {{ .MountPath }}
              subPath: {{ .SubPath }}
              readOnly: {{ .ReadOnly }}
            {{- end }}
            {{- end }}
            - name: shared-doca-driver-toolkit
              mountPath: /mnt/shared-doca-driver-toolkit
          {{- with index .RuntimeSpec.ContainerResources "openshift-driver-toolkit-ctr" }}
          resources:
            {{- if .Requests }}
            requests:
              {{ .Requests | yaml | nindent 14}}
            {{- end }}
            {{- if .Limits }}
            limits:
              {{ .Limits | yaml | nindent 14}}
            {{- end }}
          {{- end }}
        {{- end }}
      # unloading OFED modules can take more time than default terminationGracePeriod (30 sec)
      terminationGracePeriodSeconds: {{ .CrSpec.TerminationGracePeriodSeconds }}
      volumes:
        - name: run-mlnx-ofed
          hostPath:
            path: /run/mellanox/drivers
        - name: etc-network
          hostPath:
            path: /etc/network
        - name: host-etc
          hostPath:
            path: /etc
        - name: host-usr
          hostPath:
            path: /usr
        - name: host-udev
          hostPath:
            path: /lib/udev
        - name: host-run-udev
          hostPath:
            path: /run/udev
        - name: host-lib-modules
          hostPath:
            path: /lib/modules
        - name: drivers-inventory
          hostPath:
            path: /var/opt/mofed-container/inventory
            type: DirectoryOrCreate
        - name: host-ib-core
          hostPath:
            path: /etc/modprobe.d/ib_core.conf
            type: FileOrCreate
        - name: dev-infiniband
          hostPath:
            path: /dev/infiniband
            type: DirectoryOrCreate
        - name: host-proc
          hostPath:
            path: /proc
            type: Directory
        - name: host-sys
          hostPath:
            path: /sys
            type: Directory
        {{- range .AdditionalVolumeMounts.Volumes }}
        - name: {{ .Name }}
          {{- if and .ConfigMap .ConfigMap.Items }}
          configMap:
            name: {{ .Name }}
            items:
            {{- range .ConfigMap.Items }}
            {{ . | yaml | nindentPrefix 14 "- " }}
            {{- end }}
          {{- else if .HostPath }}
          hostPath:
            path: {{ .HostPath.Path }}
            type: {{ .HostPath.Type }}
          {{- end }}
        {{- end }}
        {{- if .RuntimeSpec.UseDtk }}
        - name: shared-doca-driver-toolkit
          emptyDir: {}
        {{- end }}
      nodeSelector:
        feature.node.kubernetes.io/pci-15b3.present: "true"
        feature.node.kubernetes.io/system-os_release.ID: {{ .RuntimeSpec.OSName }}
        feature.node.kubernetes.io/system-os_release.VERSION_ID: "{{ .RuntimeSpec.OSVer }}"
        feature.node.kubernetes.io/kernel-version.full: "{{ .RuntimeSpec.Kernel }}"
        {{- if .RuntimeSpec.UseDtk }}
        feature.node.kubernetes.io/system-os_release.OSTREE_VERSION: "{{ .RuntimeSpec.RhcosVersion }}"
        {{- end }}
        {{- range $k, $v := .NodeSelector }}
        {{ $k }}: {{ $v | quote }}
        {{- end }}
      {{- if .NodeAffinity }}
      affinity:
        nodeAffinity:
          {{- .NodeAffinity | yaml | nindent 10 }}
      {{- end }}
