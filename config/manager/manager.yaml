apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      labels:
        control-plane: controller-manager
        nvidia.com/ofed-driver-upgrade-drain.skip: "true"
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Equal"
          value: ""
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Equal"
          value: ""
          effect: "NoSchedule"
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              preference:
                matchExpressions:
                  - key: "node-role.kubernetes.io/master"
                    operator: In
                    values: [""]
            - weight: 1
              preference:
                matchExpressions:
                  - key: "node-role.kubernetes.io/control-plane"
                    operator: In
                    values: [ "" ]
      securityContext:
        runAsUser: 65532
      # system-node-critical keeps the controller in the same graceful node shutdown
      # phase as MOFED so it can update network.nvidia.com/operator.mofed.wait
      # before the node goes down. See https://github.com/Mellanox/network-operator/issues/2954.
      priorityClassName: system-node-critical
      containers:
      - command:
        - /manager
        args:
        - --leader-elect
        imagePullPolicy: IfNotPresent
        image: controller:latest
        name: manager
        env:
          - name: STATE_MANIFEST_BASE_DIR
            value: "/manifests"
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: ENABLE_WEBHOOKS
            value: "false"
          - name: USE_DTK
            value: "true"
        # Keep the controller reconciling while MOFED pods begin terminating
        # during graceful node shutdown. Requires Kubernetes >= 1.29.
        lifecycle:
          preStop:
            sleep:
              seconds: 25
        securityContext:
          allowPrivilegeEscalation: false
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 5m
            memory: 64Mi
      serviceAccountName: controller-manager
      # Must be greater than the preStop sleep duration above.
      terminationGracePeriodSeconds: 30
