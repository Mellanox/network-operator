name: Publish production image attestations

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose CI signed the staging evidence
        type: string
        required: true
      digest:
        description: sha256 digest already promoted to production (index digest for operator images)
        type: string
        required: true
      variant:
        description: Image built by the release CI
        type: choice
        options: [operator, coverage, bundle, bundle-coverage]
        required: true
      destination:
        description: Existing production repository; bundle location must match its promotion
        type: choice
        options:
          - nvcr.io/nvidia/cloud-native/network-operator
          - nvcr.io/nvidia/cloud-native/network-operator-bundle
          - nvcr.io/nvidia/mellanox/network-operator-bundle
        required: true

permissions:
  contents: read

# Serialize writes to a subject, including retries or different release tags for the same bytes.
concurrency:
  group: production-attestations-${{ inputs.destination }}-${{ inputs.digest }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Mellanox/network-operator' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    environment: image-attestations-production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: docker/login-action@v4
        with:
          registry: nvcr.io
          username: $oauthtoken
          # Environment-scoped credential: read staging and write production attestations.
          password: ${{ secrets.NVCR_ATTESTATION_TOKEN }}
      - name: Verify the build evidence and attest the production digest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          IMAGE_DIGEST: ${{ inputs.digest }}
          IMAGE_VARIANT: ${{ inputs.variant }}
          DESTINATION: ${{ inputs.destination }}
        run: |
          python3 hack/scripts/image-attestations.py publish \
            --tag "$RELEASE_TAG" --digest "$IMAGE_DIGEST" \
            --variant "$IMAGE_VARIANT" --destination "$DESTINATION"
