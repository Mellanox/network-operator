name: Image attestations
description: Sign release image evidence at the immutable build output digest
inputs:
  digest:
    description: Digest returned by the image build/push
    required: true
  variant:
    description: operator, coverage, bundle, or bundle-coverage
    required: true
runs:
  using: composite
  steps:
    - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: v3.1.4
    - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        syft-version: v1.56.0
    - name: Generate, sign and verify build evidence
      shell: bash
      env:
        IMAGE_DIGEST: ${{ inputs.digest }}
        IMAGE_VARIANT: ${{ inputs.variant }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        python3 hack/scripts/image-attestations.py build \
          --digest "$IMAGE_DIGEST" --variant "$IMAGE_VARIANT" --tag "$RELEASE_TAG"
